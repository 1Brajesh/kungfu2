name = "kungfu2"
compatibility_date = "2025-02-14"
workers_dev = true
routes = [{ pattern = "kungfu2.brajesh.com", custom_domain = true }]
# The relay for online play; everything else is a static file from public/.
main = "worker/index.js"

[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
